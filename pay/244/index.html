<script>
  (function () {
    // --- Amount from ?amount= query: fallback for decimals or amounts outside the
    // pre-built /pay/<n>/ range. Server-rendered amount pages have no query, so this no-ops there. ---
    function parseAmount(raw) {
      if (raw == null || raw === "") return null;
      var n = parseFloat(raw);
      if (!isFinite(n) || n <= 0) return null;
      n = Math.round(n * 100) / 100;
      return n > 1000000 ? null : n;
    }

    function formatAmount(n) {
      return Number.isInteger(n) ? String(n) : n.toFixed(2);
    }

    var params = new URLSearchParams(window.location.search);
    var amount = parseAmount(params.get("amount"));

    if (amount !== null) {
      var amountStr = formatAmount(amount);
      var display = "$" + amountStr;

      var block = document.getElementById("pay-amount");
      var value = block && block.querySelector(".pay-amount__value");
      if (block) block.classList.remove("hidden");
      if (value) value.textContent = display;

      document.querySelectorAll("[data-pay-base]").forEach(function (link) {
        var base = link.getAttribute("data-pay-base");
        var sep = link.getAttribute("data-pay-sep") || "/";
        link.setAttribute("href", base + sep + encodeURIComponent(amountStr));
      });
    }

    // --- Copy username to clipboard ---
    var buttons = document.querySelectorAll(".copy-btn");

    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      // Fallback for older / insecure-context browsers
      return new Promise(function (resolve, reject) {
        var el = document.createElement("textarea");
        el.value = text;
        el.setAttribute("readonly", "");
        el.style.position = "absolute";
        el.style.left = "-9999px";
        document.body.appendChild(el);
        el.select();
        try {
          document.execCommand("copy") ? resolve() : reject();
        } catch (err) {
          reject(err);
        }
        document.body.removeChild(el);
      });
    }

    buttons.forEach(function (button) {
      var icon = button.querySelector(".copy-btn__icon");
      var status = button.parentNode.querySelector(".copy-btn__status");
      var timer;

      button.addEventListener("click", function () {
        copyText(button.getAttribute("data-copy")).then(
          function () {
            button.classList.add("is-copied");
            if (icon) icon.classList.replace("icon--fa6-solid--copy", "icon--fa6-solid--check");
            if (status) {
              status.textContent = "Copied!";
              status.classList.add("is-visible");
            }
            clearTimeout(timer);
            timer = setTimeout(function () {
              button.classList.remove("is-copied");
              if (icon) icon.classList.replace("icon--fa6-solid--check", "icon--fa6-solid--copy");
              if (status) status.classList.remove("is-visible");
            }, 2000);
          },
          function () {
            if (status) {
              status.textContent = "Press to copy";
              status.classList.add("is-visible");
            }
          }
        );
      });
    });
  })();
</script>
